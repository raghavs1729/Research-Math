name = "Nahm"
version = "0.1.0"
defaultTargets = ["Nahm", "NahmStatement", "NahmSolution"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "51e6992efd06126df61a496bebf8f49482a4e129"

# The KRTW library (q-Pochhammer symbols, Gaussian binomials, coefficientwise sums, the finite
# Jacobi triple product) and the RRFusion certificates (Durfee identity, Cartan inverses).
[[require]]
name = "KRTW"
path = "../lean-krtw"

[[require]]
name = "RRFusion"
path = "../rr-identities/lean"

# The proof development.
[[lean_lib]]
name = "Nahm"

# Statement layer.  Trusted: NahmStatement.lean (Mathlib only; definitions + statements, proofs `sorry`).
# Untrusted: NahmSolution (imports Nahm, proves the same statements).
[[lean_lib]]
name = "NahmStatement"

[[lean_lib]]
name = "NahmSolution"
