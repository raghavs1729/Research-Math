name = "LeanRace"
version = "0.1.0"
defaultTargets = ["RaceLib", "RaceChallengeDeps", "RaceChallenge", "RaceSolution"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

# zeta23 (anthropics/formal-math, folder zeta23/), pinned.  It pins Mathlib
# 51e6992efd06126df61a496bebf8f49482a4e129 and Lean v4.33.0-rc2; we inherit both.
[[require]]
name = "Zeta23"
git = "https://github.com/anthropics/formal-math"
rev = "11b6c7e3c927df2658f513b6b68ea7f8929c62c5"
subDir = "zeta23"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "51e6992efd06126df61a496bebf8f49482a4e129"

# The proof development.
[[lean_lib]]
name = "RaceLib"

# Comparator-style statement layer.  Trusted: RaceChallengeDeps + RaceChallenge (Mathlib only).
# Untrusted: RaceSolution (imports RaceLib, hence Zeta23).
# (The modules cannot be called ChallengeDeps / Challenge / Solution as in the Palomar template:
# the Zeta23 dependency already ships root modules with exactly those names, and Lake refuses to
# disambiguate `import ChallengeDeps` between two packages.)
[[lean_lib]]
name = "RaceChallengeDeps"
roots = ["RaceChallengeDeps"]

[[lean_lib]]
name = "RaceChallenge"
roots = ["RaceChallenge"]

[[lean_lib]]
name = "RaceSolution"
roots = ["RaceSolution"]
