name = "KRTW"
version = "0.1.0"
defaultTargets = ["KRTW", "KRTWStatement", "KRTWSolution"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "51e6992efd06126df61a496bebf8f49482a4e129"

# The proof development.
[[lean_lib]]
name = "KRTW"

# Statement layer.  Trusted: KRTWStatement.lean (Mathlib only; definitions + statements, proofs `sorry`).
# Untrusted: KRTWSolution (imports KRTW, proves the same statements).
[[lean_lib]]
name = "KRTWStatement"

[[lean_lib]]
name = "KRTWSolution"
